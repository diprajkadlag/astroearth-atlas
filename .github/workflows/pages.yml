name: Deploy site

# Publishes the built site to GitHub Pages, but only after CI has passed on
# main. The workflow stays inactive until the repository variable
# PAGES_ENABLED is "true". Set it when the repository becomes public
# (GitHub Free serves Pages from public repositories only).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for the project path
        # A project site lives under /<repository>/, so the bundle is built
        # for that prefix.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Refuse to publish unfinished legal pages
        # A document page must not hold a [TODO] marker
        # (scripts/check-release.mjs).
        run: npm run release-check

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
